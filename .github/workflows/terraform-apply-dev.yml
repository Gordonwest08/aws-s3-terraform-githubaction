name: Terraform Apply (dev)

on:
  pull_request:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest

    environment:
      name: dev
      url: https://console.aws.amazon.com/s3

    defaults:
      run:
        working-directory: envis/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::910541869155:role/GitHubActions-aws-s3-terraform-role
          aws-region: us-east-1

      - name: Remove Stale Terraform Lock
        run: |
          LOCK_ID=$(aws dynamodb scan \
            --table-name terraform-locks \
            --filter-expression "#P = :path" \
            --expression-attribute-names '{"#P":"Path"}' \
            --expression-attribute-values '{":path":{"S":"gordonwest-terraform-state/s3-project/dev/terraform.tfstate"}}' \
            --query "Items[0].LockID.S" \
            --output text)
          if [ "$LOCK_ID" != "None" ]; then
            terraform force-unlock -force $LOCK_ID
          else
            echo "No active Terraform lock found."
          fi

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve
